<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Crypto stack: from master password to encrypted entry blob">
    <defs>
        <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1e3a8a"/>
            <stop offset="1" stop-color="#0f172a"/>
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
        </marker>
    </defs>

    <style>
        .bg-panel { fill: #f8fafc; }
        .box { fill: url(#boxGrad); stroke: #38bdf8; stroke-width: 2; }
        .box-text { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
        .sub-text { fill: #cbd5e1; font-family: system-ui, sans-serif; font-size: 11px; text-anchor: middle; }
        .label { fill: #1e40af; font-family: ui-monospace, monospace; font-size: 11px; text-anchor: middle; font-weight: 600; }
        .arrow { stroke: #1e40af; stroke-width: 2; fill: none; marker-end: url(#arrow); }
        .gold { fill: #f59e0b; }
    </style>

    <rect class="bg-panel" width="720" height="360"/>

    <rect class="box" x="40" y="20" width="200" height="60" rx="8"/>
    <text class="box-text" x="140" y="45">Master password</text>
    <text class="sub-text" x="140" y="65">"my secret passphrase"</text>

    <line class="arrow" x1="140" y1="85" x2="140" y2="120"/>
    <text class="label" x="220" y="105">Argon2id(salt=db_uuid)</text>

    <rect class="box" x="40" y="125" width="200" height="60" rx="8"/>
    <text class="box-text" x="140" y="150">master_key</text>
    <text class="sub-text" x="140" y="170">32 bytes (256 bits)</text>

    <line class="arrow" x1="140" y1="190" x2="140" y2="225"/>
    <text class="label" x="220" y="210">HKDF-SHA256</text>

    <rect class="box" x="40" y="230" width="200" height="60" rx="8"/>
    <text class="box-text" x="140" y="255">entry_key</text>
    <text class="sub-text" x="140" y="275">32 bytes — encrypts all entries</text>

    <rect class="box" x="440" y="125" width="240" height="60" rx="8"/>
    <text class="box-text" x="560" y="150">Entry fragment (XML)</text>
    <text class="sub-text" x="560" y="170">title, username, password, ...</text>

    <text class="label" x="560" y="210">+ 24-byte random nonce</text>

    <rect class="box" x="440" y="230" width="240" height="60" rx="8"/>
    <text class="box-text" x="560" y="255">XChaCha20-Poly1305</text>
    <text class="sub-text" x="560" y="275">authenticated encryption</text>

    <line class="arrow" x1="240" y1="260" x2="440" y2="260"/>

    <rect class="box gold" x="240" y="310" width="240" height="42" rx="8" fill="#f59e0b" stroke="#fde047"/>
    <text style="fill:#0f172a;font-family:system-ui,sans-serif;font-size:13px;font-weight:700;text-anchor:middle" x="360" y="330">Encrypted blob → server</text>
    <text style="fill:#0f172a;font-family:ui-monospace,monospace;font-size:10px;text-anchor:middle" x="360" y="346">nonce ‖ ciphertext ‖ MAC</text>

    <line class="arrow" x1="560" y1="290" x2="380" y2="315"/>
</svg>
