<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bidirectional sync between two devices via the server">
    <defs>
        <linearGradient id="boxGrad2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1e3a8a"/>
            <stop offset="1" stop-color="#0f172a"/>
        </linearGradient>
        <marker id="arrow2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e40af"/>
        </marker>
    </defs>

    <style>
        .bg-panel { fill: #f8fafc; }
        .box2 { fill: url(#boxGrad2); stroke: #38bdf8; stroke-width: 2; }
        .server-box { fill: #1a2540; stroke: #475569; stroke-width: 2; }
        .b-text { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
        .s-text { fill: #cbd5e1; font-family: system-ui, sans-serif; font-size: 10px; text-anchor: middle; }
        .l-text { fill: #1e40af; font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600; }
        .ar { stroke: #1e40af; stroke-width: 2; fill: none; marker-end: url(#arrow2); }
        .hdr { fill: #0f172a; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
    </style>

    <rect class="bg-panel" width="720" height="320"/>

    <text class="hdr" x="100" y="25">Device 1 (yours)</text>

    <rect class="box2" x="20" y="40" width="160" height="44" rx="6"/>
    <text class="b-text" x="100" y="58">KeePassXC GUI</text>
    <text class="s-text" x="100" y="74">my.kdbx</text>

    <line class="ar" x1="100" y1="90" x2="100" y2="115"/>
    <text class="l-text" x="105" y="105">fsnotify</text>

    <rect class="box2" x="20" y="120" width="160" height="44" rx="6"/>
    <text class="b-text" x="100" y="138">DeltaSync daemon</text>
    <text class="s-text" x="100" y="154">Argon2id → entry_key</text>

    <line class="ar" x1="100" y1="170" x2="100" y2="200"/>
    <text class="l-text" x="100" y="188" text-anchor="middle">export + encrypt</text>

    <rect class="box2" x="20" y="205" width="160" height="40" rx="6"/>
    <text class="b-text" x="100" y="222">PUT entry blob</text>
    <text class="s-text" x="100" y="238">authenticated TLS</text>

    <text class="hdr" x="360" y="25">Server</text>

    <rect class="server-box" x="270" y="40" width="180" height="205" rx="8"/>
    <text class="b-text" x="360" y="65">PostgreSQL</text>
    <text class="s-text" x="360" y="85">entry_versions:</text>
    <text class="s-text" x="360" y="100">• encrypted blob</text>
    <text class="s-text" x="360" y="115">• modified_at</text>
    <text class="s-text" x="360" y="130">• server_seq (monotonic)</text>
    <text class="s-text" x="360" y="145">• 3 versions per entry</text>
    <text class="s-text" x="360" y="170">─────────────</text>
    <text class="s-text" x="360" y="190">Server CANNOT</text>
    <text class="s-text" x="360" y="205">decrypt blobs.</text>
    <text class="s-text" x="360" y="220">It only serializes writes</text>
    <text class="s-text" x="360" y="235">via database_seq.</text>

    <line class="ar" x1="180" y1="225" x2="270" y2="225"/>
    <line class="ar" x1="270" y1="60" x2="180" y2="135"/>
    <text class="l-text" x="225" y="80" text-anchor="middle">GET /changes</text>

    <text class="hdr" x="620" y="25">Device 2</text>

    <rect class="box2" x="540" y="40" width="160" height="44" rx="6"/>
    <text class="b-text" x="620" y="58">DeltaSync daemon</text>
    <text class="s-text" x="620" y="74">same master_key</text>

    <line class="ar" x1="620" y1="90" x2="620" y2="115"/>
    <text class="l-text" x="625" y="105">decrypt</text>

    <rect class="box2" x="540" y="120" width="160" height="44" rx="6"/>
    <text class="b-text" x="620" y="138">keepassxc-cli merge</text>
    <text class="s-text" x="620" y="154">field-level, mtime wins</text>

    <line class="ar" x1="620" y1="170" x2="620" y2="200"/>
    <text class="l-text" x="625" y="188">update</text>

    <rect class="box2" x="540" y="205" width="160" height="40" rx="6"/>
    <text class="b-text" x="620" y="222">my.kdbx (copy)</text>
    <text class="s-text" x="620" y="238">on device 2</text>

    <line class="ar" x1="540" y1="60" x2="450" y2="135"/>
    <text class="l-text" x="495" y="80" text-anchor="middle">PUT</text>
    <line class="ar" x1="450" y1="225" x2="540" y2="135"/>
    <text class="l-text" x="495" y="195" text-anchor="middle">GET</text>
</svg>
