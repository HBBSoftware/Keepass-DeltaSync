#
# DeltaSync — DEVELOPER compose: builds the app image from local source.
# Most people want compose.yml instead (pulls a prebuilt image, no checkout
# needed). Use this when you are hacking on server/ and want your changes built:
#
#   docker compose -f compose.build.yml up -d --build
#
# Same config surface as compose.yml; only the `app` image source differs.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keepass_deltasync
      POSTGRES_USER: deltasync
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deltasync -d keepass_deltasync"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8080}:80"
    environment:
      DATABASE_URL: "pgsql:host=db;port=5432;dbname=keepass_deltasync"
      DATABASE_USER: deltasync
      DATABASE_PASSWORD: ${DB_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-30}
      ENROLLMENT_TOKEN_TTL_HOURS: ${ENROLLMENT_TOKEN_TTL_HOURS:-24}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-4}
      ARGON2_THREADS: ${ARGON2_THREADS:-1}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: keepass_deltasync
      PGUSER: deltasync
      PGPASSWORD: ${DB_PASSWORD}

volumes:
  pgdata:
