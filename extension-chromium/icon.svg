<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Sync arcs -->
  <g fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round">
    <path d="M 44 128 A 84 84 0 0 1 196 80"/>
    <path d="M 212 128 A 84 84 0 0 1 60 176"/>
  </g>

  <!-- Delta-shaped arrowheads (Δ = delta) -->
  <polygon points="196,60 220,86 184,98" fill="#38bdf8"/>
  <polygon points="60,196 36,170 72,158" fill="#38bdf8"/>

  <!-- Key -->
  <g fill="url(#key)">
    <!-- Key bow (head) -->
    <circle cx="100" cy="128" r="30"/>
    <!-- Key shaft -->
    <rect x="124" y="119" width="64" height="18" rx="3"/>
    <!-- Key teeth -->
    <rect x="156" y="137" width="10" height="16"/>
    <rect x="174" y="137" width="8" height="12"/>
  </g>
  <!-- Bow hole -->
  <circle cx="100" cy="128" r="12" fill="#0f172a"/>
</svg>
