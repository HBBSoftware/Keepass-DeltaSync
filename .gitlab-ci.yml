# GitLab CI/CD pipeline for keepass-deltasync.
#
# This is a MONOREPO with independently-versioned components. Release tags are
# NAMESPACED BY COMPONENT so their version lines never collide:
#
#   client/vX.Y.Z   → desktop Go client  (this pipeline builds + releases it)
#   android/vX.Y.Z  → Android app         (built & signed outside CI for now)
#   server/vX.Y.Z   → PHP server          (this pipeline builds + pushes a
#                                          multi-arch Docker image to the GitLab
#                                          Container Registry)
#
# Plain `vX.Y.Z` tags are LEGACY (v1.0.0 = old client line, v0.1.0 = a first
# unified attempt that re-stamped the client as a lower number) and no longer
# trigger anything. See VERSIONING.md.
#
# Stages:
#   - test:    runs `go vet` + `go test` on every commit and MR
#   - build:   cross-compiles client binaries — only on client/vX.Y.Z tags
#   - release: publishes a GitLab Release with download links — same gate
#
# To cut a new client release:
#   git tag client/v1.1.0
#   git push origin client/v1.1.0
#
# The release page shows up at
#   https://gitlab.com/Star95/keepass-deltasync/-/releases

stages:
  - test
  - build
  - publish
  - release

variables:
  # Match client/go.mod's required version. Bump when go.mod bumps.
  GO_VERSION: "1.26"

# ----------------------------------------------------------------------
# Tests
# ----------------------------------------------------------------------

test:client:
  stage: test
  image: golang:${GO_VERSION}-alpine
  before_script:
    - cd client
  script:
    - go vet ./...
    - go test ./...

# ----------------------------------------------------------------------
# Cross-compile binaries (only on client/vX.Y.Z tags)
# ----------------------------------------------------------------------

build:client:
  stage: build
  image: golang:${GO_VERSION}-alpine
  rules:
    - if: $CI_COMMIT_TAG =~ /^client\/v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache tar gzip zip coreutils
  script:
    - mkdir -p dist
    - |
      set -eu
      # Strip the "client/" namespace prefix → bare semver for the binary
      # version string and artifact filenames (which must not contain a slash).
      VERSION="${CI_COMMIT_TAG#client/}"
      echo "VERSION=$VERSION" >> build.env
      # Pass this job's id forward so the release job can build slash-free
      # artifact URLs that don't depend on the (slashed) tag ref.
      echo "BUILD_JOB_ID=$CI_JOB_ID" >> build.env
      TARGETS="linux/amd64 darwin/amd64 darwin/arm64 windows/amd64"
      for t in $TARGETS; do
        GOOS="${t%/*}"
        GOARCH="${t#*/}"
        EXT=""
        ARCHIVE_EXT="tar.gz"
        if [ "$GOOS" = "windows" ]; then
          EXT=".exe"
          ARCHIVE_EXT="zip"
        fi
        STAGE_DIR="dist/keepass-deltasync-${VERSION}-${GOOS}-${GOARCH}"
        mkdir -p "$STAGE_DIR"
        echo "==> Building $GOOS/$GOARCH"
        ( cd client && \
          GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "../${STAGE_DIR}/keepass-deltasync${EXT}" \
            ./cmd/keepass-deltasync )
        cp README.md "$STAGE_DIR/" 2>/dev/null || true
        cp client/README.md "$STAGE_DIR/CLIENT-README.md" 2>/dev/null || true
        cp LICENSE "$STAGE_DIR/" 2>/dev/null || true
        ARCHIVE="dist/keepass-deltasync-${VERSION}-${GOOS}-${GOARCH}.${ARCHIVE_EXT}"
        if [ "$ARCHIVE_EXT" = "zip" ]; then
          ( cd dist && zip -qr "$(basename "$ARCHIVE")" "$(basename "$STAGE_DIR")" )
        else
          tar czf "$ARCHIVE" -C dist "$(basename "$STAGE_DIR")"
        fi
        rm -rf "$STAGE_DIR"
        echo "    → $ARCHIVE"
      done
    - cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS
  artifacts:
    # CI_COMMIT_REF_SLUG slugifies the slash (client/v1.1.0 → client-v1-1-0)
    # so the artifact bundle name stays filesystem-safe.
    name: "keepass-deltasync-${CI_COMMIT_REF_SLUG}"
    reports:
      dotenv: build.env
    paths:
      - dist/*.tar.gz
      - dist/*.zip
      - dist/SHA256SUMS
    expire_in: never

# ----------------------------------------------------------------------
# Build + push the server Docker image (only on server/vX.Y.Z tags)
# ----------------------------------------------------------------------
#
# Produces a multi-arch (amd64 + arm64) image so it runs on x86 servers/NAS as
# well as ARM boxes (Raspberry Pi, ARM VPS, Apple Silicon). Always pushed to
# this project's GitLab Container Registry — credentials are injected
# automatically (CI_REGISTRY_USER / CI_REGISTRY_PASSWORD), no setup needed.
#
# OPTIONAL add-ons, each activated only when its CI/CD variable is set (so the
# job keeps working untouched until you opt in):
#   • Docker Hub mirror — set DOCKERHUB_USER + DOCKERHUB_TOKEN (a Docker Hub
#     access token). Optionally DOCKERHUB_IMAGE to override the repo name
#     (default: $DOCKERHUB_USER/deltasync-server). Same multi-arch image is
#     pushed there in the same build. (The Docker Hub page's short + full
#     description are NOT set by the push — a PAT lacks the scope to edit them.
#     Paste them once from docs/dockerhub-overview.md via the Docker Hub UI:
#     Repository -> Manage repository -> Description + Overview.)
#   • cosign signature — set COSIGN_PRIVATE_KEY (a cosign private key) and
#     COSIGN_PASSWORD. The pushed image digest is signed in every registry it
#     was pushed to. Verify with:  cosign verify --key cosign.pub <image>
#
# Cut a server release:
#   git tag server/v0.1.0 && git push origin server/v0.1.0
#
# Consumers then pull (anonymously, public project):
#   registry.gitlab.com/star95/keepass-deltasync/server:0.1.0   (and :latest)

publish:server-image:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG =~ /^server\/v\d+\.\d+\.\d+$/
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # Register QEMU so we can cross-build arm64 from an amd64 runner.
    - docker run --rm --privileged tonistiigi/binfmt --install all
    # dind exposes the Docker daemon over TLS via env vars; buildx's
    # docker-container driver can't consume that directly, so wrap the current
    # environment in an explicit docker context and build the builder on it.
    - docker context create buildx-env
    - docker buildx create --use --name deltasync-builder buildx-env
  script:
    - |
      set -eu
      VERSION="${CI_COMMIT_TAG#server/}"          # server/v0.1.0 → v0.1.0
      VERSION="${VERSION#v}"                       # v0.1.0 → 0.1.0
      IMAGE="$CI_REGISTRY_IMAGE/server"

      # GitLab registry tags are always pushed.
      TAGS="--tag $IMAGE:$VERSION --tag $IMAGE:latest"
      SIGN_REFS="$IMAGE"

      # Optional Docker Hub mirror (only if the access token is configured).
      if [ -n "${DOCKERHUB_TOKEN:-}" ]; then
        DHIMAGE="${DOCKERHUB_IMAGE:-${DOCKERHUB_USER}/deltasync-server}"
        echo "==> Docker Hub mirror enabled: $DHIMAGE"
        echo "$DOCKERHUB_TOKEN" | docker login -u "${DOCKERHUB_USER}" --password-stdin docker.io
        TAGS="$TAGS --tag docker.io/$DHIMAGE:$VERSION --tag docker.io/$DHIMAGE:latest"
        SIGN_REFS="$SIGN_REFS docker.io/$DHIMAGE"
      fi

      echo "==> Building $IMAGE:$VERSION (+ :latest) for linux/amd64,linux/arm64"
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --label "org.opencontainers.image.version=${VERSION}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        $TAGS \
        --metadata-file /tmp/build-meta.json \
        --push \
        ./server

      # Optional cosign signature (only if a signing key is configured). Sign by
      # digest — the same manifest-list digest was pushed to every registry.
      if [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then
        DIGEST="$(sed -n 's/.*"containerimage.digest": *"\([^"]*\)".*/\1/p' /tmp/build-meta.json)"
        echo "==> Signing $DIGEST with cosign"
        COSIGN_VERSION=v2.4.1
        wget -qO /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
        chmod +x /usr/local/bin/cosign
        for ref in $SIGN_REFS; do
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${ref}@${DIGEST}"
        done
      fi

# ----------------------------------------------------------------------
# Publish GitLab Release
# ----------------------------------------------------------------------

release:client:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^client\/v\d+\.\d+\.\d+$/
  needs:
    - job: build:client
      artifacts: true
  script:
    - echo "Creating release for ${CI_COMMIT_TAG} (client ${VERSION})"
  release:
    name: 'keepass-deltasync client ${VERSION}'
    description: |
      Pre-built keepass-deltasync desktop client binaries for ${VERSION}.

      Verify integrity with SHA256SUMS. Build from source: see README.md.
    tag_name: '${CI_COMMIT_TAG}'
    assets:
      links:
        - name: 'Linux (amd64) — .tar.gz'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/keepass-deltasync-${VERSION}-linux-amd64.tar.gz'
          link_type: 'package'
        - name: 'macOS Intel (amd64) — .tar.gz'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/keepass-deltasync-${VERSION}-darwin-amd64.tar.gz'
          link_type: 'package'
        - name: 'macOS Apple Silicon (arm64) — .tar.gz'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/keepass-deltasync-${VERSION}-darwin-arm64.tar.gz'
          link_type: 'package'
        - name: 'Windows (amd64) — .zip'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/keepass-deltasync-${VERSION}-windows-amd64.zip'
          link_type: 'package'
        - name: 'SHA256SUMS'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/SHA256SUMS'
          link_type: 'other'

# ----------------------------------------------------------------------
# Mirror the client release to GitHub Releases (optional)
# ----------------------------------------------------------------------
#
# Uploads the same desktop binaries to a GitHub Release on the public mirror,
# so the GitHub showcase has downloadable artifacts too. Activated only when
# GITHUB_TOKEN is set (a GitHub PAT with `repo` scope on the mirror repo), so
# it stays dormant until you opt in. Override GITHUB_REPO if the mirror moves.
# The client/v* tag is already on GitHub (origin pushes tags to both remotes).

release:client-github:
  stage: release
  image: alpine:3
  variables:
    GITHUB_REPO: "HBBSoftware/Keepass-DeltaSync"
  rules:
    - if: $CI_COMMIT_TAG =~ /^client\/v\d+\.\d+\.\d+$/ && $GITHUB_TOKEN
  needs:
    - job: build:client
      artifacts: true
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -eu
      VERSION="${CI_COMMIT_TAG#client/}"
      API="https://api.github.com/repos/$GITHUB_REPO"
      AUTH="Authorization: Bearer $GITHUB_TOKEN"
      ACCEPT="Accept: application/vnd.github+json"

      # Create the release for this tag, or reuse it if it already exists.
      body=$(printf '{"tag_name":"%s","name":"keepass-deltasync client %s","body":"Pre-built desktop client binaries for %s. Verify integrity with SHA256SUMS; build from source: see README.md."}' "$CI_COMMIT_TAG" "$VERSION" "$VERSION")
      code=$(curl -sS -o /tmp/rel.json -w '%{http_code}' -X POST "$API/releases" -H "$AUTH" -H "$ACCEPT" -d "$body")
      if [ "$code" = "201" ]; then
        echo "==> created GitHub release $CI_COMMIT_TAG"
      else
        echo "==> release create returned $code; fetching existing release by tag"
        curl -fsS "$API/releases/tags/$CI_COMMIT_TAG" -H "$AUTH" -H "$ACCEPT" -o /tmp/rel.json
      fi
      rid=$(jq -r '.id' /tmp/rel.json)
      [ -n "$rid" ] && [ "$rid" != "null" ] || { echo "could not resolve release id"; cat /tmp/rel.json; exit 1; }

      existing=$(curl -fsS "$API/releases/$rid/assets" -H "$AUTH" -H "$ACCEPT" | jq -r '.[].name')
      for f in dist/*.tar.gz dist/*.zip dist/SHA256SUMS; do
        name=$(basename "$f")
        if echo "$existing" | grep -qx "$name"; then
          echo "    skip (already uploaded): $name"
          continue
        fi
        curl -fsS -X POST "https://uploads.github.com/repos/$GITHUB_REPO/releases/$rid/assets?name=$name" \
          -H "$AUTH" -H "Content-Type: application/octet-stream" \
          --data-binary @"$f" >/dev/null
        echo "    uploaded: $name"
      done
