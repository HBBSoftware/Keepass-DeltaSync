# GitLab CI/CD pipeline for keepass-deltasync.
#
# This is a MONOREPO with independently-versioned components. Release tags are
# NAMESPACED BY COMPONENT so their version lines never collide:
#
#   client/vX.Y.Z   → desktop Go client  (this pipeline builds + releases it)
#   android/vX.Y.Z  → Android app         (this pipeline builds an UNSIGNED APK;
#                                          signing happens on the maintainer's
#                                          machine — see build:android below)
#   server/vX.Y.Z   → PHP server          (this pipeline builds + pushes a
#                                          multi-arch Docker image to the GitLab
#                                          Container Registry)
#   extension/vX.Y.Z → Firefox extension   (this pipeline packages an UNSIGNED
#                                          .xpi; signing happens outside CI —
#                                          see build:extension below)
#
# Plain `vX.Y.Z` tags are LEGACY (v1.0.0 = old client line, v0.1.0 = a first
# unified attempt that re-stamped the client as a lower number) and no longer
# trigger anything. See VERSIONING.md.
#
# Stages:
#   - test:    runs `go vet` + `go test` on every commit and MR
#   - build:   cross-compiles client binaries — only on client/vX.Y.Z tags
#   - release: publishes a GitLab Release with download links — same gate
#
# To cut a new client release:
#   git tag client/v1.1.0
#   git push origin client/v1.1.0
#
# The release page shows up at
#   https://gitlab.com/Star95/keepass-deltasync/-/releases

stages:
  - test
  - build
  - publish
  - release

variables:
  # Match client/go.mod's required version. Bump when go.mod bumps.
  GO_VERSION: "1.26"

# ----------------------------------------------------------------------
# Tests
# ----------------------------------------------------------------------

test:client:
  stage: test
  image: golang:${GO_VERSION}-alpine
  before_script:
    - cd client
  script:
    - go vet ./...
    - go test ./...

# Mozillas egen linter. Kører kun når extension/ faktisk er rørt — et
# npm-hentende job hører ikke til på hver eneste commit.
#
# --warnings-as-errors er med vilje: udvidelsen står på nul advarsler i dag, og
# de advarsler der dukker op her kommer typisk fra en ÆNDRET AMO-politik
# (`data_collection_permissions` blev fx pludselig påkrævet). Det vil vi vide
# med det samme, ikke når en indsendelse bliver afvist.
test:extension:
  stage: test
  image: node:22-alpine
  rules:
    - if: $CI_COMMIT_TAG =~ /^extension\/v\d+\.\d+\.\d+$/
    - changes:
        - extension/**/*
  script:
    - npx --yes web-ext lint --source-dir extension --warnings-as-errors

# ----------------------------------------------------------------------
# Cross-compile binaries (only on client/vX.Y.Z tags)
# ----------------------------------------------------------------------

build:client:
  stage: build
  image: golang:${GO_VERSION}-alpine
  rules:
    - if: $CI_COMMIT_TAG =~ /^client\/v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache tar gzip zip coreutils
  script:
    - mkdir -p dist
    - |
      set -eu
      # Strip the "client/" namespace prefix → bare semver for the binary
      # version string and artifact filenames (which must not contain a slash).
      VERSION="${CI_COMMIT_TAG#client/}"
      echo "VERSION=$VERSION" >> build.env
      # Pass this job's id forward so the release job can build slash-free
      # artifact URLs that don't depend on the (slashed) tag ref.
      echo "BUILD_JOB_ID=$CI_JOB_ID" >> build.env
      TARGETS="linux/amd64 darwin/amd64 darwin/arm64 windows/amd64"
      for t in $TARGETS; do
        GOOS="${t%/*}"
        GOARCH="${t#*/}"
        EXT=""
        ARCHIVE_EXT="tar.gz"
        if [ "$GOOS" = "windows" ]; then
          EXT=".exe"
          ARCHIVE_EXT="zip"
        fi
        STAGE_DIR="dist/keepass-deltasync-${VERSION}-${GOOS}-${GOARCH}"
        mkdir -p "$STAGE_DIR"
        echo "==> Building $GOOS/$GOARCH"
        ( cd client && \
          GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "../${STAGE_DIR}/keepass-deltasync${EXT}" \
            ./cmd/keepass-deltasync )
        cp README.md "$STAGE_DIR/" 2>/dev/null || true
        cp client/README.md "$STAGE_DIR/CLIENT-README.md" 2>/dev/null || true
        cp LICENSE "$STAGE_DIR/" 2>/dev/null || true
        ARCHIVE="dist/keepass-deltasync-${VERSION}-${GOOS}-${GOARCH}.${ARCHIVE_EXT}"
        if [ "$ARCHIVE_EXT" = "zip" ]; then
          ( cd dist && zip -qr "$(basename "$ARCHIVE")" "$(basename "$STAGE_DIR")" )
        else
          tar czf "$ARCHIVE" -C dist "$(basename "$STAGE_DIR")"
        fi
        rm -rf "$STAGE_DIR"
        echo "    → $ARCHIVE"
      done
    - cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS
  artifacts:
    # CI_COMMIT_REF_SLUG slugifies the slash (client/v1.1.0 → client-v1-1-0)
    # so the artifact bundle name stays filesystem-safe.
    name: "keepass-deltasync-${CI_COMMIT_REF_SLUG}"
    reports:
      dotenv: build.env
    paths:
      - dist/*.tar.gz
      - dist/*.zip
      - dist/SHA256SUMS
    expire_in: never

# ----------------------------------------------------------------------
# Build the Android APK — UNSIGNED (only on android/vX.Y.Z tags)
# ----------------------------------------------------------------------
#
# Deliberately stops short of signing. The release keystore is what binds every
# future update to this project: anyone who can read it can ship an APK that
# Android will happily install over ours. Putting it in CI variables would hand
# it to every Maintainer and to any job that gets compromised, so it stays on
# the maintainer's machine.
#
# The job therefore produces `DeltaSync-<version>-unsigned.apk` as an artifact.
# Download it, then run `android/publish-release.sh` locally — it signs the
# unsigned APK with android/keystore.properties and uploads the result.
#
# android/app/build.gradle.kts only wires up a signingConfig when
# keystore.properties exists, which it never does here, so assembleRelease
# yields an unsigned APK without any CI-specific branching.
#
# The base image pins Go (its whole point); the JDK comes from Debian and the
# Android SDK/NDK from Google's sdkmanager, cached between runs.

build:android:
  stage: build
  # Trixie, not bookworm: android/sync/build.gradle.kts declares
  # jvmToolchain(21) to match Android Studio's bundled JBR, and bookworm only
  # ships JDK 17. Trixie is also what F-Droid's buildserver runs, so our build
  # and theirs sit on the same JDK.
  # Pinned to the exact patch release, not floating 1.26: the Go version string
  # is compiled into libgojni.so, so our APK only reproduces F-Droid's if both
  # sides use the same compiler. Bump this together with the `srclibs: go@...`
  # line in metadata/dk.bjoerckbraun.deltasync.yml, never on its own.
  image: golang:1.26.3-trixie
  rules:
    - if: $CI_COMMIT_TAG =~ /^android\/v\d+\.\d+\.\d+$/
    # Escape hatch for iterating on this job itself. Without it, the only way
    # to exercise an Android build is to move a published tag — which F-Droid
    # notices and dislikes. Push to a ci/android-* branch instead.
    - if: $CI_COMMIT_BRANCH =~ /^ci\/android/
  variables:
    # /opt/android-sdk, not a path under $CI_PROJECT_DIR: cgo hands the NDK
    # path to clang, which writes it into libgojni.so's DWARF line table, so
    # the SDK has to sit where F-Droid's builder keeps it. The path is
    # hard-coded in fdroidserver's buildserver Vagrantfile.
    #
    # A symlink from /opt is NOT enough — clang resolves its own binary to
    # find lib64/clang/*/include, so the physical path leaks back in. The SDK
    # therefore installs into /opt on every run and is not cached; GitLab can
    # only cache paths inside the project dir. That costs a few minutes on a
    # job that only runs on android/v* tags and ci/android-* branches.
    ANDROID_HOME: "/opt/android-sdk"
    GOPATH: "$CI_PROJECT_DIR/.go"
    JAVA_HOME: "/usr/lib/jvm/java-21-openjdk-amd64"
    # gomobile bind runs javac over the Java it generates, and that Java
    # carries the Danish doc comments from client/mobile/*.go verbatim. JDK 17
    # takes its default source encoding from the platform locale, which is
    # US-ASCII in a bare container — every æ/ø/å and → then becomes
    # "error: unmappable character". Debian ships C.UTF-8 with no setup.
    LANG: "C.UTF-8"
    LC_ALL: "C.UTF-8"
    # Must match metadata/dk.bjoerckbraun.deltasync.yml's ndk: field, so our
    # APK and F-Droid's are built against the same NDK.
    NDK_VERSION: "25.2.9519653"
    COMPILE_SDK: "35"
    BUILD_TOOLS: "35.0.0"
    CMDLINE_TOOLS: "11076708"
    # Pinned to client/go.mod's x/mobile — reproducibility, not convenience.
    XMOBILE: "v0.0.0-20260520154334-0e4426e1883d"
  cache:
    key: "android-$CMDLINE_TOOLS-$NDK_VERSION-$BUILD_TOOLS"
    paths:
      - .go/pkg/mod/
      - .gradle-home/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends openjdk-21-jdk-headless unzip
    - |
      set -eu
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        echo "==> installing Android cmdline-tools $CMDLINE_TOOLS"
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        curl -fsSL -o /tmp/cmdline-tools.zip \
          "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS}_latest.zip"
        unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
        mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
      fi
      export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
      # Feed the licence prompts from a FILE, never a pipe. The runner runs
      # scripts under `set -o pipefail`, so `yes | sdkmanager` fails the job
      # with exit 141: sdkmanager stops reading, `yes` dies of SIGPIPE, and
      # pipefail promotes that to the pipeline's status even though every
      # licence was accepted. Redirecting from a regular file cannot SIGPIPE.
      for _ in $(seq 1 100); do echo y; done > /tmp/licences.txt
      sdkmanager --licenses < /tmp/licences.txt >/dev/null
      # stdout is progress spam; errors still reach stderr and the log.
      sdkmanager --install "platforms;android-$COMPILE_SDK" \
                           "build-tools;$BUILD_TOOLS" \
                           "ndk;$NDK_VERSION" >/dev/null
  script:
    - |
      set -eu
      export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
      export PATH="$GOPATH/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
      export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle-home"

      GRADLE_VERSION=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VERSION="${CI_COMMIT_TAG#android/v}"      # android/v0.4.0 → 0.4.0
        # Refuse to build a version the app doesn't claim to be — the tag and
        # build.gradle.kts drifting apart is the easy mistake here.
        if [ "$GRADLE_VERSION" != "$VERSION" ]; then
          echo "tag says $VERSION but build.gradle.kts says $GRADLE_VERSION" >&2
          exit 1
        fi
      else
        # ci/android-* branch run: nothing to cross-check against.
        VERSION="$GRADLE_VERSION"
        echo "==> branch build of $VERSION (not a release)"
      fi

      # Build from F-Droid's own path, not $CI_PROJECT_DIR. gomobile hands the
      # Go toolchain a temporary gobind module that `replace`s our client
      # module by absolute path, and that path lands in the binary's build info
      # — the one thing -trimpath does not rewrite. `fdroid build` always uses
      # /home/vagrant/build/<applicationId>, so we mirror it exactly; otherwise
      # libgojni.so can never match theirs. git archive (not cp) so we build
      # the committed tree, the same content F-Droid checks out.
      BUILD_ROOT=/home/vagrant/build/dk.bjoerckbraun.deltasync
      mkdir -p "$BUILD_ROOT"
      git archive HEAD | tar -x -C "$BUILD_ROOT"
      cd "$BUILD_ROOT"

      echo "==> gomobile bind (x/mobile $XMOBILE)"
      go install "golang.org/x/mobile/cmd/gomobile@$XMOBILE"
      go install "golang.org/x/mobile/cmd/gobind@$XMOBILE"
      gomobile init
      mkdir -p android/libs
      # -trimpath is what makes the .so reproducible: without it Go bakes the
      # checkout path (/builds/... here, /home/vagrant/build/... on F-Droid's
      # builder) and gomobile's random /tmp/gomobile-work-NNN into the binary.
      # Keep it in sync with the same flag in the F-Droid build recipe.
      # Same invocation as the F-Droid recipe, flag for flag: -target=android
      # is gomobile's default and is left out there to keep the metadata line
      # under the 80 columns fdroid rewritemeta wraps at.
      ( cd client && gomobile bind -trimpath -androidapi 21 \
          -o ../android/libs/deltasync.aar ./mobile )

      # :sync compiles against the bound classes only (compileOnly), so the
      # JNI layer stays out of the pure-JVM test classpath.
      ( cd android/libs && unzip -o -q deltasync.aar classes.jar \
          && mv classes.jar deltasync-classes.jar )

      echo "==> assembleRelease"
      ( cd android && ./gradlew --no-daemon :app:assembleRelease )

      # Artifacts must land back under $CI_PROJECT_DIR — the build itself ran
      # in $BUILD_ROOT.
      mkdir -p "$CI_PROJECT_DIR/dist"
      APK=$(ls android/app/build/outputs/apk/release/*-release-unsigned.apk)
      cp "$APK" "$CI_PROJECT_DIR/dist/DeltaSync-${VERSION}-unsigned.apk"
      ( cd "$CI_PROJECT_DIR/dist" && sha256sum *.apk > SHA256SUMS-unsigned \
          && cat SHA256SUMS-unsigned )
  artifacts:
    name: "deltasync-android-${CI_COMMIT_REF_SLUG}"
    paths:
      - dist/*.apk
      - dist/SHA256SUMS-unsigned
    expire_in: never

# ----------------------------------------------------------------------
# Package the Firefox extension (only on extension/vX.Y.Z tags)
# ----------------------------------------------------------------------
#
# Producerer en USIGNERET .xpi. Signering — hos AMO eller med egen nøgle —
# sker uden for CI, præcis som med Android-APK'en: signeringsnøglen kommer
# aldrig i pipelinen.
#
# Arkivet er byte-reproducerbart (faste tidsstempler og rettigheder i
# package.sh), så enhver kan bygge taggen og kontrollere at den .xpi de har
# hentet svarer til kilden.
build:extension:
  stage: build
  image: python:3-alpine
  rules:
    - if: $CI_COMMIT_TAG =~ /^extension\/v\d+\.\d+\.\d+$/
    # Escape hatch til at arbejde på selve jobbet uden at flytte et tag.
    - if: $CI_COMMIT_BRANCH =~ /^ci\/extension/
  script:
    - |
      set -eu
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        # extension/v0.1.0 → 0.1.0. package.sh afviser at bygge hvis
        # manifest.json siger noget andet end taggen.
        VERSION="${CI_COMMIT_TAG#extension/v}"
      else
        VERSION=""
        echo "==> branch build (not a release)"
      fi
      sh extension/package.sh $VERSION
  artifacts:
    name: "deltasync-extension-${CI_COMMIT_REF_SLUG}"
    paths:
      - dist/*.xpi
      - dist/SHA256SUMS-extension
    expire_in: never

# ----------------------------------------------------------------------
# Build + push the server Docker image (only on server/vX.Y.Z tags)
# ----------------------------------------------------------------------
#
# Produces a multi-arch (amd64 + arm64) image so it runs on x86 servers/NAS as
# well as ARM boxes (Raspberry Pi, ARM VPS, Apple Silicon). Always pushed to
# this project's GitLab Container Registry — credentials are injected
# automatically (CI_REGISTRY_USER / CI_REGISTRY_PASSWORD), no setup needed.
#
# OPTIONAL add-ons, each activated only when its CI/CD variable is set (so the
# job keeps working untouched until you opt in):
#   • Docker Hub mirror — set DOCKERHUB_USER + DOCKERHUB_TOKEN (a Docker Hub
#     access token). Optionally DOCKERHUB_IMAGE to override the repo name
#     (default: $DOCKERHUB_USER/deltasync-server). Same multi-arch image is
#     pushed there in the same build. (The Docker Hub page's short + full
#     description are NOT set by the push — a PAT lacks the scope to edit them.
#     Paste them once from docs/dockerhub-overview.md via the Docker Hub UI:
#     Repository -> Manage repository -> Description + Overview.)
#   • cosign signature — set COSIGN_PRIVATE_KEY (a cosign private key) and
#     COSIGN_PASSWORD. The pushed image digest is signed in every registry it
#     was pushed to. Verify with:  cosign verify --key cosign.pub <image>
#
# Cut a server release:
#   git tag server/v0.1.0 && git push origin server/v0.1.0
#
# Consumers then pull (anonymously, public project):
#   registry.gitlab.com/star95/keepass-deltasync/server:0.1.0   (and :latest)

publish:server-image:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG =~ /^server\/v\d+\.\d+\.\d+$/
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # Register QEMU so we can cross-build arm64 from an amd64 runner.
    - docker run --rm --privileged tonistiigi/binfmt --install all
    # dind exposes the Docker daemon over TLS via env vars; buildx's
    # docker-container driver can't consume that directly, so wrap the current
    # environment in an explicit docker context and build the builder on it.
    - docker context create buildx-env
    - docker buildx create --use --name deltasync-builder buildx-env
  script:
    - |
      set -eu
      VERSION="${CI_COMMIT_TAG#server/}"          # server/v0.1.0 → v0.1.0
      VERSION="${VERSION#v}"                       # v0.1.0 → 0.1.0
      IMAGE="$CI_REGISTRY_IMAGE/server"

      # GitLab registry tags are always pushed.
      TAGS="--tag $IMAGE:$VERSION --tag $IMAGE:latest"
      SIGN_REFS="$IMAGE"

      # Optional Docker Hub mirror (only if the access token is configured).
      if [ -n "${DOCKERHUB_TOKEN:-}" ]; then
        DHIMAGE="${DOCKERHUB_IMAGE:-${DOCKERHUB_USER}/deltasync-server}"
        echo "==> Docker Hub mirror enabled: $DHIMAGE"
        echo "$DOCKERHUB_TOKEN" | docker login -u "${DOCKERHUB_USER}" --password-stdin docker.io
        TAGS="$TAGS --tag docker.io/$DHIMAGE:$VERSION --tag docker.io/$DHIMAGE:latest"
        SIGN_REFS="$SIGN_REFS docker.io/$DHIMAGE"
      fi

      echo "==> Building $IMAGE:$VERSION (+ :latest) for linux/amd64,linux/arm64"
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --label "org.opencontainers.image.version=${VERSION}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        $TAGS \
        --metadata-file /tmp/build-meta.json \
        --push \
        ./server

      # Optional cosign signature (only if a signing key is configured). Sign by
      # digest — the same manifest-list digest was pushed to every registry.
      if [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then
        DIGEST="$(sed -n 's/.*"containerimage.digest": *"\([^"]*\)".*/\1/p' /tmp/build-meta.json)"
        echo "==> Signing $DIGEST with cosign"
        COSIGN_VERSION=v2.4.1
        wget -qO /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
        chmod +x /usr/local/bin/cosign
        for ref in $SIGN_REFS; do
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${ref}@${DIGEST}"
        done
      fi

# ----------------------------------------------------------------------
# Publish GitLab Release
# ----------------------------------------------------------------------

release:client:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^client\/v\d+\.\d+\.\d+$/
  needs:
    - job: build:client
      artifacts: true
  script:
    - echo "Creating release for ${CI_COMMIT_TAG} (client ${VERSION})"
  release:
    name: 'keepass-deltasync client ${VERSION}'
    description: |
      Pre-built keepass-deltasync desktop client binaries for ${VERSION}.

      Verify integrity with SHA256SUMS. Build from source: see README.md.
    tag_name: '${CI_COMMIT_TAG}'
    assets:
      links:
        - name: 'Linux (amd64) — .tar.gz'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/keepass-deltasync-${VERSION}-linux-amd64.tar.gz'
          link_type: 'package'
        - name: 'macOS Intel (amd64) — .tar.gz'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/keepass-deltasync-${VERSION}-darwin-amd64.tar.gz'
          link_type: 'package'
        - name: 'macOS Apple Silicon (arm64) — .tar.gz'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/keepass-deltasync-${VERSION}-darwin-arm64.tar.gz'
          link_type: 'package'
        - name: 'Windows (amd64) — .zip'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/keepass-deltasync-${VERSION}-windows-amd64.zip'
          link_type: 'package'
        - name: 'SHA256SUMS'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/SHA256SUMS'
          link_type: 'other'

# ----------------------------------------------------------------------
# Mirror the client release to GitHub Releases (optional)
# ----------------------------------------------------------------------
#
# Uploads the same desktop binaries to a GitHub Release on the public mirror,
# so the GitHub showcase has downloadable artifacts too. Activated only when
# GITHUB_TOKEN is set (a GitHub PAT with `repo` scope on the mirror repo), so
# it stays dormant until you opt in. Override GITHUB_REPO if the mirror moves.
# The client/v* tag is already on GitHub (origin pushes tags to both remotes).

release:client-github:
  stage: release
  image: alpine:3
  variables:
    GITHUB_REPO: "HBBSoftware/Keepass-DeltaSync"
  rules:
    - if: $CI_COMMIT_TAG =~ /^client\/v\d+\.\d+\.\d+$/ && $GITHUB_TOKEN
  needs:
    - job: build:client
      artifacts: true
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -eu
      VERSION="${CI_COMMIT_TAG#client/}"
      API="https://api.github.com/repos/$GITHUB_REPO"
      AUTH="Authorization: Bearer $GITHUB_TOKEN"
      ACCEPT="Accept: application/vnd.github+json"

      # Create the release for this tag, or reuse it if it already exists.
      body=$(printf '{"tag_name":"%s","name":"keepass-deltasync client %s","body":"Pre-built desktop client binaries for %s. Verify integrity with SHA256SUMS; build from source: see README.md."}' "$CI_COMMIT_TAG" "$VERSION" "$VERSION")
      code=$(curl -sS -o /tmp/rel.json -w '%{http_code}' -X POST "$API/releases" -H "$AUTH" -H "$ACCEPT" -d "$body")
      if [ "$code" = "201" ]; then
        echo "==> created GitHub release $CI_COMMIT_TAG"
      else
        echo "==> release create returned $code; fetching existing release by tag"
        curl -fsS "$API/releases/tags/$CI_COMMIT_TAG" -H "$AUTH" -H "$ACCEPT" -o /tmp/rel.json
      fi
      rid=$(jq -r '.id' /tmp/rel.json)
      [ -n "$rid" ] && [ "$rid" != "null" ] || { echo "could not resolve release id"; cat /tmp/rel.json; exit 1; }

      existing=$(curl -fsS "$API/releases/$rid/assets" -H "$AUTH" -H "$ACCEPT" | jq -r '.[].name')
      for f in dist/*.tar.gz dist/*.zip dist/SHA256SUMS; do
        name=$(basename "$f")
        if echo "$existing" | grep -qx "$name"; then
          echo "    skip (already uploaded): $name"
          continue
        fi
        curl -fsS -X POST "https://uploads.github.com/repos/$GITHUB_REPO/releases/$rid/assets?name=$name" \
          -H "$AUTH" -H "Content-Type: application/octet-stream" \
          --data-binary @"$f" >/dev/null
        echo "    uploaded: $name"
      done
