# GitLab CI/CD pipeline for keepass-deltasync.
#
# This is a MONOREPO with independently-versioned components. Release tags are
# NAMESPACED BY COMPONENT so their version lines never collide:
#
#   client/vX.Y.Z   → desktop Go client  (this pipeline builds + releases it)
#   android/vX.Y.Z  → Android app         (built & signed outside CI for now)
#   server/vX.Y.Z   → PHP server          (deployed directly; no build artifact)
#
# Plain `vX.Y.Z` tags are LEGACY (v1.0.0 = old client line, v0.1.0 = a first
# unified attempt that re-stamped the client as a lower number) and no longer
# trigger anything. See VERSIONING.md.
#
# Stages:
#   - test:    runs `go vet` + `go test` on every commit and MR
#   - build:   cross-compiles client binaries — only on client/vX.Y.Z tags
#   - release: publishes a GitLab Release with download links — same gate
#
# To cut a new client release:
#   git tag client/v1.1.0
#   git push origin client/v1.1.0
#
# The release page shows up at
#   https://gitlab.com/Star95/keepass-deltasync/-/releases

stages:
  - test
  - build
  - release

variables:
  # Match client/go.mod's required version. Bump when go.mod bumps.
  GO_VERSION: "1.26"

# ----------------------------------------------------------------------
# Tests
# ----------------------------------------------------------------------

test:client:
  stage: test
  image: golang:${GO_VERSION}-alpine
  before_script:
    - cd client
  script:
    - go vet ./...
    - go test ./...

# ----------------------------------------------------------------------
# Cross-compile binaries (only on client/vX.Y.Z tags)
# ----------------------------------------------------------------------

build:client:
  stage: build
  image: golang:${GO_VERSION}-alpine
  rules:
    - if: $CI_COMMIT_TAG =~ /^client\/v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache tar gzip zip coreutils
  script:
    - mkdir -p dist
    - |
      set -eu
      # Strip the "client/" namespace prefix → bare semver for the binary
      # version string and artifact filenames (which must not contain a slash).
      VERSION="${CI_COMMIT_TAG#client/}"
      echo "VERSION=$VERSION" >> build.env
      # Pass this job's id forward so the release job can build slash-free
      # artifact URLs that don't depend on the (slashed) tag ref.
      echo "BUILD_JOB_ID=$CI_JOB_ID" >> build.env
      TARGETS="linux/amd64 darwin/amd64 darwin/arm64 windows/amd64"
      for t in $TARGETS; do
        GOOS="${t%/*}"
        GOARCH="${t#*/}"
        EXT=""
        ARCHIVE_EXT="tar.gz"
        if [ "$GOOS" = "windows" ]; then
          EXT=".exe"
          ARCHIVE_EXT="zip"
        fi
        STAGE_DIR="dist/keepass-deltasync-${VERSION}-${GOOS}-${GOARCH}"
        mkdir -p "$STAGE_DIR"
        echo "==> Building $GOOS/$GOARCH"
        ( cd client && \
          GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "../${STAGE_DIR}/keepass-deltasync${EXT}" \
            ./cmd/keepass-deltasync )
        cp README.md "$STAGE_DIR/" 2>/dev/null || true
        cp client/README.md "$STAGE_DIR/CLIENT-README.md" 2>/dev/null || true
        cp LICENSE "$STAGE_DIR/" 2>/dev/null || true
        ARCHIVE="dist/keepass-deltasync-${VERSION}-${GOOS}-${GOARCH}.${ARCHIVE_EXT}"
        if [ "$ARCHIVE_EXT" = "zip" ]; then
          ( cd dist && zip -qr "$(basename "$ARCHIVE")" "$(basename "$STAGE_DIR")" )
        else
          tar czf "$ARCHIVE" -C dist "$(basename "$STAGE_DIR")"
        fi
        rm -rf "$STAGE_DIR"
        echo "    → $ARCHIVE"
      done
    - cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS
  artifacts:
    # CI_COMMIT_REF_SLUG slugifies the slash (client/v1.1.0 → client-v1-1-0)
    # so the artifact bundle name stays filesystem-safe.
    name: "keepass-deltasync-${CI_COMMIT_REF_SLUG}"
    reports:
      dotenv: build.env
    paths:
      - dist/*.tar.gz
      - dist/*.zip
      - dist/SHA256SUMS
    expire_in: never

# ----------------------------------------------------------------------
# Publish GitLab Release
# ----------------------------------------------------------------------

release:client:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^client\/v\d+\.\d+\.\d+$/
  needs:
    - job: build:client
      artifacts: true
  script:
    - echo "Creating release for ${CI_COMMIT_TAG} (client ${VERSION})"
  release:
    name: 'keepass-deltasync client ${VERSION}'
    description: |
      Pre-built keepass-deltasync desktop client binaries for ${VERSION}.

      Verify integrity with SHA256SUMS. Build from source: see README.md.
    tag_name: '${CI_COMMIT_TAG}'
    assets:
      links:
        - name: 'Linux (amd64) — .tar.gz'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/keepass-deltasync-${VERSION}-linux-amd64.tar.gz'
          link_type: 'package'
        - name: 'macOS Intel (amd64) — .tar.gz'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/keepass-deltasync-${VERSION}-darwin-amd64.tar.gz'
          link_type: 'package'
        - name: 'macOS Apple Silicon (arm64) — .tar.gz'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/keepass-deltasync-${VERSION}-darwin-arm64.tar.gz'
          link_type: 'package'
        - name: 'Windows (amd64) — .zip'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/keepass-deltasync-${VERSION}-windows-amd64.zip'
          link_type: 'package'
        - name: 'SHA256SUMS'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/SHA256SUMS'
          link_type: 'other'
