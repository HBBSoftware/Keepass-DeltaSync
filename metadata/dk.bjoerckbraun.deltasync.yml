AuthorName: Hans Bjørck-Braun
AuthorWebSite: https://deltasync.bjoerck-braun.dk
WebSite: https://deltasync.bjoerck-braun.dk
SourceCode: https://gitlab.com/Star95/keepass-deltasync
IssueTracker: https://gitlab.com/Star95/keepass-deltasync/-/issues
Changelog: https://gitlab.com/Star95/keepass-deltasync/-/blob/HEAD/CHANGELOG.md

RepoType: git
Repo: https://gitlab.com/Star95/keepass-deltasync.git

Builds:
  - versionName: 0.4.0
    versionCode: 5
    commit: android/v0.4.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y unzip
      - apt-get install -y -t trixie-backports golang-go
    gradle:
      - yes
    srclibs:
      - go@go1.26.3
    prebuild: sdkmanager "platforms;android-35" "build-tools;35.0.0"
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOROOT=$$go$$
      - export GOPATH="$HOME/go"
      - export PATH="$GOROOT/bin:$GOPATH/bin:$PATH"
      - export ANDROID_NDK_HOME=$$NDK$$
      - XM=golang.org/x/mobile
      - XV=v0.0.0-20260520154334-0e4426e1883d
      - go install $XM/cmd/gomobile@$XV
      - go install $XM/cmd/gobind@$XV
      - gomobile init
      - cd ../../client
      - mkdir -p ../android/libs
      - AAR=../android/libs/deltasync.aar
      - PKG=gitlab.com/Star95/keepass-deltasync/client/mobile
      - gomobile bind -androidapi 21 -target=android -o $AAR $PKG
      - cd ../android/libs
      - unzip -o deltasync.aar classes.jar
      - mv classes.jar deltasync-classes.jar
    ndk: 25.2.9519653

AutoUpdateMode: Version
UpdateCheckMode: Tags ^android/v[\d.]+$
CurrentVersion: 0.4.0
CurrentVersionCode: 5
