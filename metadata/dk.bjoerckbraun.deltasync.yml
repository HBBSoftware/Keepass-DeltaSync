Builds:
  - versionName: 0.3.1
    versionCode: 4
    commit: android/v0.3.1
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y unzip curl
      - curl -fsSL https://go.dev/dl/go1.26.3.linux-amd64.tar.gz -o /tmp/go.tar.gz
      - echo "2b2cfc7148493da5e73981bffbf3353af381d5f93e789c82c79aff64962eb556  /tmp/go.tar.gz"
        | sha256sum -c -
      - rm -rf /usr/local/go
      - tar -C /usr/local -xzf /tmp/go.tar.gz
    gradle:
      - yes
    prebuild:
      - export PATH=/usr/local/go/bin:$PATH
      - export GOPATH=/tmp/go
      - export GOTOOLCHAIN=local
      - export ANDROID_NDK_HOME=$$NDK$$
      - sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260520154334-0e4426e1883d
      - go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260520154334-0e4426e1883d
      - export PATH=$GOPATH/bin:$PATH
      - gomobile init
      - cd ../../client
      - mkdir -p ../android/libs
      - gomobile bind -androidapi 21 -target=android -o ../android/libs/deltasync.aar
        gitlab.com/Star95/keepass-deltasync/client/mobile
      - cd ../android/libs
      - unzip -o deltasync.aar classes.jar
      - mv classes.jar deltasync-classes.jar
    scanignore:
      - android/libs/deltasync.aar
      - android/libs/deltasync-classes.jar
      - android/libs/deltasync-sources.jar
    ndk: 25.2.9519653

AutoUpdateMode: Version
UpdateCheckMode: Tags ^android/v[\d.]+$
