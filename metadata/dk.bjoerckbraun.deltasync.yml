Builds:
  - versionName: 0.4.2
    versionCode: 7
    commit: dce1172fbd5353be89dbc417616e1ff253c916e1
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y -t trixie-backports golang-1.27-go
    gradle:
      - yes
    srclibs:
      - go@go1.26.3
    prebuild: sdkmanager "platforms;android-35" "build-tools;35.0.0"
    build:
      - export GOROOT_BOOTSTRAP=/usr/lib/go-1.27
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOROOT=$$go$$
      - export GOPATH="$HOME/go"
      - export PATH="$GOROOT/bin:$GOPATH/bin:$PATH"
      - export ANDROID_NDK_HOME=$$NDK$$
      - cd ../../client
      - go install golang.org/x/mobile/cmd/gomobile
      - go install golang.org/x/mobile/cmd/gobind
      - gomobile init
      - mkdir -p ../android/libs
      - gomobile bind -trimpath -androidapi 21 -o deltasync.aar ./mobile
      - mv deltasync.aar ../android/libs/
      - cd ../android/libs
      - unzip -p deltasync.aar classes.jar > deltasync-classes.jar
    ndk: 25.2.9519653

