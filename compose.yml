#
# DeltaSync — self-hosted server. Pulls a prebuilt image; no source checkout
# or build needed. Works with `docker compose` AND pasted into a NAS UI
# (TrueNAS SCALE "Custom App", Portainer stack, Unraid, etc.).
#
# Set up:
#   1. Change the password below (the ONE line marked CHANGE THIS).
#   2. Start it:   docker compose up -d      (or paste into your NAS app UI)
#   3. Read the one-time admin token from the logs:
#         docker compose logs app            (or the app's log view in the NAS UI)
#
# The app listens on http://<host>:8080. For internet exposure, put an
# HTTPS-terminating reverse proxy in front (Caddy/Traefik/nginx, or your NAS's
# built-in reverse proxy) — the app speaks plain HTTP.
#
# Pin a specific version instead of :latest by changing the image tag, e.g.
#   registry.gitlab.com/star95/keepass-deltasync/server:0.1.0

# One place to set the database password; referenced by all services below.
x-db-password: &db_password "CHANGE_THIS_to_a_long_random_string"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keepass_deltasync
      POSTGRES_USER: deltasync
      POSTGRES_PASSWORD: *db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deltasync -d keepass_deltasync"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: registry.gitlab.com/star95/keepass-deltasync/server:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      # --- App config ---
      DATABASE_URL: "pgsql:host=db;port=5432;dbname=keepass_deltasync"
      DATABASE_USER: deltasync
      DATABASE_PASSWORD: *db_password
      LOG_LEVEL: INFO
      # --- DB access for the entrypoint's schema migrations ---
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: keepass_deltasync
      PGUSER: deltasync
      PGPASSWORD: *db_password

volumes:
  pgdata:
