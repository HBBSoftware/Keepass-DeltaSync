#
# DeltaSync — local / self-hosted deployment via Docker Compose.
#
#   1. cp .env.example .env   &&   edit .env (set DB_PASSWORD)
#   2. docker compose up -d --build
#   3. docker compose logs app   # grab the one-time admin token printed on first boot
#
# The app listens on http://localhost:${HOST_PORT:-8080}. Put a TLS-terminating
# reverse proxy (Caddy/Traefik/nginx) in front for production — the app speaks
# plain HTTP inside the compose network.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keepass_deltasync
      POSTGRES_USER: deltasync
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deltasync -d keepass_deltasync"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8080}:80"
    environment:
      # --- App config (read by src/Config.php) ---
      DATABASE_URL: "pgsql:host=db;port=5432;dbname=keepass_deltasync"
      DATABASE_USER: deltasync
      DATABASE_PASSWORD: ${DB_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-30}
      ENROLLMENT_TOKEN_TTL_HOURS: ${ENROLLMENT_TOKEN_TTL_HOURS:-24}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-4}
      ARGON2_THREADS: ${ARGON2_THREADS:-1}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      # --- libpq vars (read by psql/pg_isready in the entrypoint) ---
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: keepass_deltasync
      PGUSER: deltasync
      PGPASSWORD: ${DB_PASSWORD}

volumes:
  pgdata:
