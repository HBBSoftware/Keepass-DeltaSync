<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="DeltaSync">
  <!--
    DeltaSync-mærket. Koordinater og farver er kopieret 1:1 fra
    android/app/src/main/res/drawable/ic_launcher_foreground.xml, som selv
    spejler logo.svg fra hjemmesiden. Ændrer nogen mærket ét sted, skal de
    tre følges ad — derfor er tallene her ikke rundet eller "ryddet op".

    Baggrunden er Android-launcherens gradient lagt på en afrundet flade, da
    en browser ikke maskerer ikonet som et adaptive icon gør.
  -->
  <defs>
    <linearGradient id="ds-bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E3A8A" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="ds-bow" x1="100" y1="98" x2="100" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE047" />
      <stop offset="1" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="ds-shaft" x1="156" y1="119" x2="156" y2="137" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE047" />
      <stop offset="1" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#ds-bg)" />

  <!-- Sync-buerne -->
  <g fill="none" stroke="#38BDF8" stroke-width="14" stroke-linecap="round">
    <path d="M 44,128 A 84,84 0 0 1 196,80" />
    <path d="M 212,128 A 84,84 0 0 1 60,176" />
  </g>

  <!-- Delta-formede pilespidser -->
  <path fill="#38BDF8" d="M 196,60 L 220,86 L 184,98 Z" />
  <path fill="#38BDF8" d="M 60,196 L 36,170 L 72,158 Z" />

  <!-- Nøglen -->
  <circle cx="100" cy="128" r="30" fill="url(#ds-bow)" />
  <rect x="124" y="119" width="64" height="18" fill="url(#ds-shaft)" />
  <rect x="156" y="137" width="10" height="16" fill="#F59E0B" />
  <rect x="174" y="137" width="8" height="12" fill="#F59E0B" />
  <circle cx="100" cy="128" r="12" fill="#0F172A" />
</svg>
